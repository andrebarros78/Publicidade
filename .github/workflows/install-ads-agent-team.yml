name: Install ADS Agent Team

on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-ads-agent-team.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-team:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar quadro profissional e contratos
        shell: bash
        run: |
          set -euo pipefail
          ROOT='oficina/ads-ai-hub'
          mkdir -p "$ROOT/agentic/agents" "$ROOT/agentic/contracts" "$ROOT/agentic/knowledge" "$ROOT/agentic/runtime" "$ROOT/tests/agentic" 'laboratorio/ads-ai-hub/agentic'

          cat > "$ROOT/agentic/registry.json" <<'EOF'
          {
            "version": "0.2.0",
            "principle": "Owner defines only spend ceiling and business constraints; agent team owns advertising strategy and execution inside those limits.",
            "runtime": "openai-agents-python",
            "contract_standard": "AdCP-compatible internal contracts",
            "agents": [
              {"id":"chief_ads_officer","title":"Diretor Geral de Publicidade","reports_to":"owner","primary":"OpenAI Agents SDK","autonomy":"full_within_budget"},
              {"id":"marketing_strategist","title":"Estrategista de Marketing","reports_to":"chief_ads_officer","primary":"Synter marketing skills","autonomy":"recommend_and_execute"},
              {"id":"market_intelligence","title":"Especialista de Mercado e Concorrência","reports_to":"marketing_strategist","primary":"competitive intelligence + public ad libraries","autonomy":"analyze"},
              {"id":"consumer_intelligence","title":"Especialista em Consumidor e Público","reports_to":"marketing_strategist","primary":"audience expansion + signals","autonomy":"analyze_and_test"},
              {"id":"product_portfolio","title":"Especialista de Produto e Portfólio","reports_to":"chief_ads_officer","primary":"portfolio economics","autonomy":"rank_and_allocate"},
              {"id":"performance_scientist","title":"Cientista de Performance","reports_to":"chief_ads_officer","primary":"statistical performance analysis","autonomy":"analyze"},
              {"id":"marketing_science","title":"Cientista de Marketing / MMM","reports_to":"performance_scientist","primary":"Google Meridian","secondary":"Meta Robyn","autonomy":"model_and_recommend"},
              {"id":"attribution_specialist","title":"Especialista em Atribuição e Incrementalidade","reports_to":"performance_scientist","primary":"incrementality + attribution skills","autonomy":"analyze"},
              {"id":"budget_allocator","title":"Gestor Autônomo de Orçamento","reports_to":"chief_ads_officer","primary":"Meridian optimizer + policy engine","autonomy":"redistribute_within_owner_ceiling"},
              {"id":"experiment_scientist","title":"Especialista em Experimentos e A/B","reports_to":"performance_scientist","primary":"controlled experimentation","autonomy":"launch_bounded_tests"},
              {"id":"creative_director","title":"Diretor de Criação","reports_to":"marketing_strategist","primary":"creative performance intelligence","autonomy":"brief_test_rotate"},
              {"id":"copywriter","title":"Copywriter de Performance","reports_to":"creative_director","primary":"direct-response copy","autonomy":"generate_and_test"},
              {"id":"meta_media_buyer","title":"Especialista Meta Ads","reports_to":"chief_ads_officer","primary":"Meta Marketing API + meta-ads-mcp","autonomy":"execute_within_policy"},
              {"id":"tiktok_media_buyer","title":"Especialista TikTok Ads","reports_to":"chief_ads_officer","primary":"TikTok Business API + tiktok ads adapter","autonomy":"execute_within_policy"},
              {"id":"risk_guardian","title":"Guardião de Risco e Spend Guard","reports_to":"owner_policy","primary":"OPA + deterministic guards","autonomy":"veto"},
              {"id":"ads_operations","title":"Operações, Auditoria e Recuperação","reports_to":"chief_ads_officer","primary":"NATS + PostgreSQL + OpenTelemetry","autonomy":"operate_recover_audit"}
            ]
          }
          EOF

          cat > "$ROOT/agentic/contracts/decision.schema.json" <<'EOF'
          {
            "$schema":"https://json-schema.org/draft/2020-12/schema",
            "title":"AdsAgentDecision",
            "type":"object",
            "required":["agent","evidence","confidence","decision","risk","actions"],
            "properties":{
              "agent":{"type":"string"},
              "evidence":{"type":"array","items":{"type":"object"}},
              "metrics":{"type":"object"},
              "confidence":{"type":"number","minimum":0,"maximum":1},
              "decision":{"type":"string"},
              "risk":{"enum":["low","medium","high","blocked"]},
              "actions":{"type":"array","items":{"$ref":"action.schema.json"}}
            }
          }
          EOF

          cat > "$ROOT/agentic/contracts/action.schema.json" <<'EOF'
          {
            "$schema":"https://json-schema.org/draft/2020-12/schema",
            "title":"AdsAction",
            "type":"object",
            "required":["action_id","platform","operation","object_id","reversible","evidence_refs"],
            "properties":{
              "action_id":{"type":"string","minLength":1},
              "platform":{"enum":["meta","tiktok","internal"]},
              "operation":{"type":"string","minLength":1},
              "object_id":{"type":"string","minLength":1},
              "before":{"type":"object"},
              "after":{"type":"object"},
              "evidence_refs":{"type":"array","items":{"type":"string"}},
              "expected_impact":{"type":"object"},
              "max_loss":{"type":"number","minimum":0},
              "reversible":{"type":"boolean"},
              "idempotency_key":{"type":"string"}
            }
          }
          EOF

          cat > "$ROOT/agentic/contracts/owner-policy.schema.json" <<'EOF'
          {
            "$schema":"https://json-schema.org/draft/2020-12/schema",
            "title":"OwnerAdvertisingPolicy",
            "type":"object",
            "required":["currency","monthly_spend_ceiling"],
            "properties":{
              "currency":{"type":"string","default":"BRL"},
              "monthly_spend_ceiling":{"type":"number","minimum":0},
              "max_test_loss":{"type":"number","minimum":0,"default":0},
              "forbidden_products":{"type":"array","items":{"type":"string"}},
              "notes":{"type":"string"}
            },
            "additionalProperties":false
          }
          EOF

          cat > "$ROOT/agentic/knowledge/SOURCES.md" <<'EOF'
          # Bases especialistas selecionadas

          - Runtime multiagente: https://github.com/openai/openai-agents-python
          - Contrato publicitário aberto: https://github.com/adcontextprotocol/adcp
          - Marketing Mix Modeling / alocação: https://github.com/google/meridian
          - Segunda opinião MMM: https://github.com/facebookexperimental/Robyn
          - Skills de marketing e mídia: https://github.com/Synter-Media-AI/free-skills
          - Meta performance donor: https://github.com/TheMattBerman/meta-ads-kit
          - Meta executor donor: https://github.com/mikusnuz/meta-ads-mcp
          - TikTok executor donor: https://github.com/AdsMCP/tiktok-ads-mcp-server

          Fontes são conhecimento/ferramentas. O quadro profissional e as políticas pertencem ao ADS-AI-HUB.
          EOF

          cat > "$ROOT/agentic/runtime/team.py" <<'EOF'
          """ADS-AI-HUB autonomous team definition.

          Imports OpenAI Agents SDK when available. No API call happens at import time.
          """
          from dataclasses import dataclass
          import json
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]

          @dataclass(frozen=True)
          class AgentPost:
              id: str
              title: str
              reports_to: str
              primary: str
              autonomy: str

          def load_registry():
              return json.loads((ROOT / "registry.json").read_text(encoding="utf-8"))

          def posts():
              return [AgentPost(**a) for a in load_registry()["agents"]]

          def owner_controls():
              return {
                  "owner_defines": ["monthly_spend_ceiling", "currency", "hard_business_constraints"],
                  "system_owns": [
                      "strategy", "channel_mix", "campaign_structure", "audiences", "creatives",
                      "experiments", "budget_distribution", "optimization", "pause_scale_decisions",
                      "measurement", "reporting"
                  ],
                  "never_autonomous": [
                      "increase_owner_spend_ceiling", "change_payment_method",
                      "change_account_ownership", "irreversible_asset_deletion"
                  ]
              }
          EOF

          cat > "$ROOT/agentic/agents/POSTOS.md" <<'EOF'
          # Quadro profissional ADS-AI-HUB

          1. Diretor Geral de Publicidade — coordena e decide.
          2. Estrategista de Marketing — posicionamento, funil, canal e estratégia.
          3. Inteligência de Mercado — concorrência, tendências, demanda e oportunidade.
          4. Inteligência de Consumidor — público, comportamento, segmentos e sinais.
          5. Produto e Portfólio — decide o que promover, reduzir, testar ou retirar.
          6. Cientista de Performance — lê números, tendências e causalidade operacional.
          7. Cientista de Marketing/MMM — mede contribuição e otimiza mix de mídia.
          8. Atribuição e Incrementalidade — separa correlação de efeito incremental.
          9. Gestor de Orçamento — distribui a verba sem ultrapassar o teto do proprietário.
          10. Cientista de Experimentos — testes controlados e critérios de parada.
          11. Diretor de Criação — estratégia de criativo e fadiga.
          12. Copywriter de Performance — mensagens, ofertas, hooks e CTAs.
          13. Meta Media Buyer — operação especializada Meta.
          14. TikTok Media Buyer — operação especializada TikTok.
          15. Guardião de Risco — veto financeiro, duplicidade, segurança e limites.
          16. Operações/Auditoria/Recuperação — persistência, fila, evidência e recuperação.

          O proprietário não administra estratégia diária. Define teto financeiro e restrições duras.
          EOF

          cat > "$ROOT/tests/agentic/test_team.py" <<'EOF'
          import json
          from pathlib import Path
          import sys

          ROOT = Path(__file__).resolve().parents[2]
          sys.path.insert(0, str(ROOT))
          from agentic.runtime.team import posts, owner_controls

          def test_team_has_all_posts():
              p = posts()
              assert len(p) == 16
              assert len({x.id for x in p}) == 16

          def test_required_experts_present():
              ids = {x.id for x in posts()}
              required = {
                  'chief_ads_officer','marketing_strategist','market_intelligence','consumer_intelligence',
                  'performance_scientist','marketing_science','budget_allocator','creative_director',
                  'meta_media_buyer','tiktok_media_buyer','risk_guardian'
              }
              assert required <= ids

          def test_owner_does_not_own_strategy():
              c = owner_controls()
              assert 'strategy' in c['system_owns']
              assert 'monthly_spend_ceiling' in c['owner_defines']

          def test_agents_cannot_raise_ceiling():
              c = owner_controls()
              assert 'increase_owner_spend_ceiling' in c['never_autonomous']

          def test_contracts_parse():
              for p in (ROOT/'agentic'/'contracts').glob('*.json'):
                  json.loads(p.read_text(encoding='utf-8'))
          EOF

          cat > 'laboratorio/ads-ai-hub/agentic/README.md' <<'EOF'
          # Laboratório multiagente
          Valida composição da equipe, contratos, autonomia, limites financeiros, handoffs e regressões antes de qualquer ativação live.
          EOF

      - name: Instalar dependências de validação e testar quadro
        shell: bash
        run: |
          python -m pip install -q pytest
          cd oficina/ads-ai-hub
          pytest -q tests/agentic

      - name: Registrar instalação validada
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add oficina/ads-ai-hub/agentic oficina/ads-ai-hub/tests/agentic laboratorio/ads-ai-hub/agentic
          git commit -m 'feat: instalar equipe autônoma de 16 especialistas ADS-AI-HUB'
          git push
