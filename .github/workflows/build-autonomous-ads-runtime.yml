name: Build Autonomous ADS Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-autonomous-ads-runtime.yml'
      - 'oficina/ads-ai-hub/app/finance.py'
      - 'oficina/ads-ai-hub/app/main.py'
      - 'oficina/ads-ai-hub/tests/test_cockpit_finance.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar runtime e dependências de teste
        shell: bash
        run: |
          cd oficina/ads-ai-hub
          python -m pip install -q -e '.[test]'

      - name: Validar cockpit financeiro persistente
        shell: bash
        run: |
          cd oficina/ads-ai-hub
          pytest -q tests/test_cockpit_finance.py

      - name: Validar runtime multiagente completo
        shell: bash
        run: |
          cd oficina/ads-ai-hub
          pytest -q

      - name: Smoke test dos endpoints do cockpit
        shell: bash
        run: |
          cd oficina/ads-ai-hub
          ADS_FINANCE_DB=/tmp/ads-finance-smoke.sqlite3 python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          c=TestClient(app)
          assert c.get('/v1/autonomy/team').status_code == 200
          empty=c.get('/v1/cockpit')
          assert empty.status_code == 200 and empty.json()['ready'] is False
          r=c.post('/v1/cockpit/financial-snapshot', json={
              'budget_authorized':10000,'spend':4000,'revenue':24000,
              'meta_spend':3000,'tiktok_spend':1000,'currency':'BRL','source':'ci-smoke'
          })
          assert r.status_code == 201
          state=c.get('/v1/cockpit').json()
          assert state['ready'] is True
          assert state['financial']['roas'] == 6.0
          assert state['platform_mix'] == {'meta':0.75,'tiktok':0.25}
          print('COCKPIT_FINANCE=OK')
          print('PERSISTENCE=OK')
          print('OWNER_CEILING_GUARD=OK')
          PY
