name: Build Autonomous ADS Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-autonomous-ads-runtime.yml'
      - 'oficina/ads-ai-hub/app/finance.py'
      - 'oficina/ads-ai-hub/app/service.py'
      - 'oficina/ads-ai-hub/app/main.py'
      - 'oficina/ads-ai-hub/tests/test_finance_cockpit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar runtime e dependências de teste
        shell: bash
        run: |
          cd oficina/ads-ai-hub
          python -m pip install -q -e '.[test]'

      - name: Validar cockpit financeiro persistente
        shell: bash
        run: |
          cd oficina/ads-ai-hub
          pytest -q tests/test_finance_cockpit.py

      - name: Validar runtime multiagente completo
        shell: bash
        run: |
          cd oficina/ads-ai-hub
          pytest -q

      - name: Smoke test dos endpoints do cockpit
        shell: bash
        run: |
          cd oficina/ads-ai-hub
          python - <<'PY'
          import os, tempfile
          fd,path=tempfile.mkstemp(suffix='.sqlite3'); os.close(fd); os.unlink(path)
          os.environ['ADS_FINANCE_DB']=path
          from fastapi.testclient import TestClient
          from app.main import app
          c=TestClient(app)
          h=c.get('/health'); assert h.status_code == 200
          assert 'cockpit' in h.json()
          assert h.json()['cockpit']['ready'] is False
          r=c.get('/v1/cockpit'); assert r.status_code == 200 and r.json()['ready'] is False
          r=c.post('/v1/cockpit/financial-snapshot', json={
            'budget_authorized':10000,'spend':4000,'revenue':24000,
            'meta_spend':2500,'tiktok_spend':1500,'currency':'BRL','source':'ci'
          })
          assert r.status_code == 201
          body=c.get('/v1/cockpit').json()
          assert body['ready'] is True
          assert body['financial']['roas'] == 6.0
          assert body['platform_mix']['meta'] == 0.625
          h=c.get('/health').json()
          assert h['cockpit']['financial']['roas'] == 6.0
          print('FINANCIAL_COCKPIT=OK')
          print('HEALTH_COCKPIT=OK')
          PY
