name: Build Autonomous ADS Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-autonomous-ads-runtime.yml'
      - 'oficina/ads-ai-hub/app/finance.py'
      - 'oficina/ads-ai-hub/app/service.py'
      - 'oficina/ads-ai-hub/app/main.py'
      - 'oficina/ads-ai-hub/app/autonomy.py'
      - 'oficina/ads-ai-hub/config/model-router-policy.json'
      - 'oficina/ads-ai-hub/tests/test_cockpit_finance.py'
      - 'oficina/ads-ai-hub/tests/test_model_router_policy.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar runtime e dependências de teste
        shell: bash
        run: |
          cd oficina/ads-ai-hub
          python -m pip install -q -e '.[test]'

      - name: Validar cockpit financeiro persistente
        shell: bash
        run: |
          cd oficina/ads-ai-hub
          pytest -q tests/test_cockpit_finance.py

      - name: Validar Model Router FREE-FIRST
        shell: bash
        run: |
          cd oficina/ads-ai-hub
          pytest -q tests/test_model_router_policy.py

      - name: Validar runtime multiagente completo
        shell: bash
        run: |
          cd oficina/ads-ai-hub
          pytest -q

      - name: Smoke test dos endpoints do cockpit e router
        shell: bash
        run: |
          cd oficina/ads-ai-hub
          python - <<'PY'
          import os, tempfile
          fd,path=tempfile.mkstemp(suffix='.sqlite3'); os.close(fd); os.unlink(path)
          os.environ['ADS_FINANCE_DB']=path
          from fastapi.testclient import TestClient
          from app.main import app
          c=TestClient(app)
          h=c.get('/health'); assert h.status_code == 200
          assert 'cockpit' in h.json()
          assert h.json()['cockpit']['ready'] is False
          p=c.get('/v1/autonomy/model-policy'); assert p.status_code == 200
          assert p.json()['mode'] == 'FREE-FIRST'
          r=c.get('/v1/autonomy/model-route'); assert r.status_code == 200
          assert r.json()['selected']['provider'] == 'groq'
          r=c.get('/v1/autonomy/model-route?system_primary=true'); assert r.status_code == 200
          assert r.json()['selected']['provider'] == 'openai'
          r=c.get('/v1/autonomy/model-route?allow_paid=true'); assert r.status_code == 409
          print('MODEL_ROUTER=OK')
          print('FREE_FIRST=OK')
          print('PAID_AUX_BLOCK=OK')
          PY
